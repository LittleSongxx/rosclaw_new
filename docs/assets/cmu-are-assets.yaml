schema_version: rosclaw.cmu_are.assets.v1
project: cmu_are_sim
description: >-
  Out-of-band assets required to build or run the ROS1 CMU ARE simulation.
  Source code and launch files remain tracked in third_party/ros1/are; the
  files below are intentionally supplied by the operator and verified before
  a Docker launch. ``external_relative_path`` records the layout used by the
  local ARE workspace without embedding a host-specific absolute path.

