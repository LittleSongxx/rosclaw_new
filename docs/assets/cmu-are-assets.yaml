    size_bytes: 50971374
    sha256: a480478a7269c1f2fce743b303046204ff6613b9d440546701e478136bf98f53
    license: MIT
    mount_path: /opt/rosclaw/ros1_ws/src/ariadne2/scripts/model/checkpoint.pth
    required_for: [ariadne2_exploration]

