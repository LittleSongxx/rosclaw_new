schema_version: rosclaw.twintouch_config.v1

# Hard limits (v4 §12.2 — never candidate-modifiable)
hard_force_limit_raw: 300
temperature_start_max_c: 46.0
temperature_abort_c: 49.0
temperature_hardware_protection_c: 52.0
joint_min_raw: 50
joint_max_raw: 1000
servo_max_speed_approach: 150
servo_max_speed_fine: 100
max_active_pairs: 1
camera_freshness_ms: 500.0
permit_lifetime_s: 300.0

# Approach discipline (proven single-hand values: 40-raw kernel steps,
# two-phase 40→10 approach, speed-150 cap)
coarse_step_raw: 40
fine_step_raw: 10
approach_force_set: 150
dwell_force_set: 100
coast_force_set: 50
retreat_speed: 300
retreat_force_set: 150

# Contact thresholds — PROVISIONAL ceilings; T1 calibration may only
# lower them.
contact_force_delta_raw: 60
non_target_force_abort_raw: 60
dwell_ms_default: 300.0

# Coordination
max_start_skew_ms: 250.0
peer_wait_timeout_ms: 2000.0
